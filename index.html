
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Town Builder • World Foundation</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font:600 14px system-ui,sans-serif;
    background:#378fae;
    color:#fff
}

button{
    font:inherit;
    cursor:pointer;
    color:inherit;
    border:0;
    touch-action:manipulation
}

#world{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:grab
}

#hud{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:10px;
    right:10px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    pointer-events:none
}

.stat{
    background:#183c3ae8;
    border:1px solid #ffffff44;
    border-radius:12px;
    padding:7px 12px;
    box-shadow:0 3px 8px #1235;
    min-width:82px
}

.stat small{
    display:block;
    font-size:10px;
    color:#c8e7da;
    text-transform:uppercase;
    letter-spacing:.8px
}

.stat b{
    font-size:17px;
    color:#fff5d6
}

#zoom{
    position:absolute;
    right:12px;
    top:37%;
    display:grid;
    gap:6px
}

#zoom button{
    background:#173c3de8;
    border:1px solid #ffffff44;
    border-radius:10px;
    width:42px;
    height:42px;
    font-size:20px
}

#dock{
    position:absolute;
    bottom:max(10px,env(safe-area-inset-bottom));
    left:10px;
    right:10px;
    max-width:860px;
    margin:auto;
    background:#173b3af2;
    border:1px solid #ffffff55;
    border-radius:16px;
    box-shadow:0 5px 20px #1237;
    padding:9px
}

#tools,#catalogue{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:thin
}

#tools button{
    flex:none;
    border-radius:8px;
    padding:7px 12px;
    background:#32605b
}

#catalogue{padding-top:7px}

.item{
    flex:0 0 96px;
    min-height:68px;
    border-radius:9px;
    background:#f4edda;
    color:#244139;
    padding:5px;
    display:grid;
    justify-items:center;
    align-content:center;
    gap:2px;
    border:2px solid transparent
}

.item i{
    font-style:normal;
    font-size:23px
}

.item small{
    font-size:11px;
    color:#42614c
}

.item.active{
    border-color:#e8b843;
    background:#fff5c4
}

#tools .active{
    background:#e9b949;
    color:#243a35
}

#status{
    min-height:18px;
    margin:7px 2px 0;
    color:#e4f2d9;
    font-size:12px
}

#save{margin-left:auto}

@media(max-width:500px){
    .stat{min-width:64px;padding:5px 8px}
    .stat b{font-size:14px}
    #hud{gap:4px}
    .item{flex-basis:82px}
    #dock{padding:7px}
    #zoom{right:8px}
}
</style>
</head>

<body>

<canvas id="world" aria-label="Isometric town map"></canvas>

<div id="hud">
    <div class="stat">
        <small>Cash</small>
        <b id="cash">0</b>
    </div>

    <div class="stat">
        <small>Gold</small>
        <b id="gold">0</b>
    </div>

    <div class="stat">
        <small>Residents</small>
        <b id="population">0</b>
    </div>

    <div class="stat">
        <small>Income / 10s</small>
        <b id="income">0</b>
    </div>

    <div class="stat" id="save">
        <small>Progress</small>
        <b id="saveState">Local</b>
    </div>
</div>

<div id="zoom">
    <button id="plus" aria-label="Zoom in">+</button>
    <button id="minus" aria-label="Zoom out">−</button>
    <button id="home" aria-label="Centre map">⌂</button>
</div>

<div id="dock">
    <div id="tools">
        <button data-mode="build">Build</button>
        <button data-mode="pan" class="active">Explore</button>
        <button data-mode="move">Move</button>
        <button data-mode="sell">Sell</button>
    </div>

    <div id="catalogue"></div>

    <div id="status" aria-live="polite">
        Drag to explore • Scroll or pinch to zoom
    </div>
</div>

<script>
'use strict';

// ========================================
// 01 — CATALOGUE AND ECONOMY
// ========================================

const TYPES = {
    cottage:{
        name:'Cottage',
        icon:'🏡',
        cost:250,
        rent:30,
        pop:4
    },
    villa:{
        name:'Villa',
        icon:'🏠',
        cost:650,
        rent:70,
        pop:8
    },
    shop:{
        name:'Shop',
        icon:'🏪',
        cost:400,
        rent:55,
        pop:0
    },
    road:{
        name:'Road',
        icon:'🛣️',
        cost:15,
        rent:0,
        pop:0
    },
    park:{
        name:'Park',
        icon:'🌳',
        cost:90,
        rent:0,
        pop:0
    },
    farm:{
        name:'Farm plot',
        icon:'🌾',
        cost:120,
        rent:15,
        pop:0
    }
};

const N=38;
const HW=40;
const HH=20;
const SAVE='townBuilder.world.v02';

const $=id=>document.getElementById(id);
const canvas=$('world');
const ctx=canvas.getContext('2d');

const money=n=>'£'+Math.floor(n).toLocaleString('en-GB');
const key=(x,y)=>x+','+y;
const inside=(x,y)=>x>=0&&y>=0&&x<N&&y<N;

function hash(x,y,s=0){
    let v=Math.sin(
        x*127.1+y*311.7+s*74.7
    )*43758.5453;

    return v-Math.floor(v);
}

function newTown(){
    return {
        cash:6000,
        gold:0,
        buildings:{},
        awards:{}
    };
}

function load(){
    try{
        const s=JSON.parse(
            localStorage.getItem(SAVE)
        );

        if(
            s &&
            Number.isFinite(s.cash) &&
            Number.isFinite(s.gold) &&
            s.buildings &&
            s.awards
        ) return s;

    }catch(e){}

    return newTown();
}

let town=load();
let mode='pan';
let selected='cottage';
let moving=null;
let hover=null;

let W=1,H=1,DPR=1;
let zoom=1,camX=0,camY=0;
let ready=false,dirty=true;

function message(s){
    $('status').textContent=s;
}

function totals(){
    let rent=0,pop=0;

    for(const b of Object.values(town.buildings)){
        const t=TYPES[b.type];

        if(t){
            rent+=t.rent;
            pop+=t.pop;
        }
    }

    return {rent,pop};
}

function hud(){
    const t=totals();

    $('cash').textContent=money(town.cash);
    $('gold').textContent=town.gold;
    $('population').textContent=t.pop;
    $('income').textContent=money(t.rent);
}

function save(){
    try{
        localStorage.setItem(
            SAVE,
            JSON.stringify(town)
        );

        $('saveState').textContent='Saved';

    }catch(e){
        $('saveState').textContent='Not saved';
    }
}

function achievements(){
    const count=Object.values(
        town.buildings
    ).filter(
        b=>b.type==='cottage'||b.type==='villa'
    ).length;

    if(count>=5&&!town.awards.firstVillage){
        town.awards.firstVillage=true;
        town.gold+=5;

        return ' • First village! +5 gold';
    }

    return '';
}

setInterval(()=>{
    town.cash+=totals().rent;
    hud();
    save();
},10000);

window.addEventListener('pagehide',save);

document.addEventListener(
    'visibilitychange',
    ()=>{
        if(document.hidden)save();
    }
);

// ========================================
// 02 — TERRAIN GENERATION
// ========================================

function water(x,y){
    if(!inside(x,y))return true;

    const edge=
        x<2+Math.sin(y*.48)*1.4 ||
        y<2+Math.cos(x*.33)*1.5 ||
        x>N-3+Math.sin(y*.35)*1.6 ||
        y>N-3+Math.cos(x*.4)*1.2;

    const river=
        Math.abs(
            x-(27+Math.sin(y*.22)*2.4)
        )<1.25;

    return edge||river;
}

function terrain(x,y){

    if(water(x,y))return 'water';

    if(
        [[1,0],[-1,0],[0,1],[0,-1]]
        .some(([a,b])=>water(x+a,y+b))
    )return 'sand';

    return 'grass';
}

const tiles=[];

for(let x=0;x<N;x++){
    for(let y=0;y<N;y++){

        let type=terrain(x,y);

        tiles.push({
            x,
            y,
            type,
            tree:type==='grass'&&hash(x,y,7)>.82,
            variant:hash(x,y,2)
        });
    }
}

tiles.sort(
    (a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x
);

function canBuild(x,y){
    return (
        inside(x,y) &&
        terrain(x,y)==='grass' &&
        !town.buildings[key(x,y)]
    );
}

// ========================================
// 03 — ISOMETRIC CAMERA
// ========================================

function project(x,y,z=0){
    return [
        (x-y)*HW,
        (x+y)*HH-z
    ];
}

function tileAt(sx,sy){

    const X=(sx-camX)/zoom;
    const Y=(sy-camY)/zoom;

    return {
        x:Math.round((X/HW+Y/HH)/2),
        y:Math.round((Y/HH-X/HW)/2)
    };
}

function centre(){

    zoom=Math.max(
        .55,
        Math.min(1.3,W/650)
    );

    const [x,y]=project(16,16);

    camX=W/2-x*zoom;
    camY=H*.45-y*zoom;

    dirty=true;
}

function resize(){

    const oldW=W;
    const oldH=H;

    W=canvas.clientWidth;
    H=canvas.clientHeight;

    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);

    if(!ready){
        centre();
        ready=true;
    }else{
        camX+=(W-oldW)/2;
        camY+=(H-oldH)/2;
    }

    dirty=true;
}

function zoomAt(f,x=W/2,y=H*.45){

    const next=Math.max(
        .35,
        Math.min(2.2,zoom*f)
    );

    camX=x-(x-camX)*next/zoom;
    camY=y-(y-camY)*next/zoom;

    zoom=next;
    dirty=true;
}

window.addEventListener('resize',resize);

$('plus').onclick=()=>zoomAt(1.25);
$('minus').onclick=()=>zoomAt(.8);
$('home').onclick=centre;

// ========================================
// 04 — ORIGINAL ISOMETRIC GRAPHICS
// ========================================

function poly(points,fill,stroke){

    ctx.beginPath();

    points.forEach(
        ([x,y],i)=>i
        ?ctx.lineTo(x,y)
        :ctx.moveTo(x,y)
    );

    ctx.closePath();

    if(fill){
        ctx.fillStyle=fill;
        ctx.fill();
    }

    if(stroke){
        ctx.strokeStyle=stroke;
        ctx.lineWidth=.7;
        ctx.stroke();
    }
}

function face(points,fill,stroke){
    poly(
        points.map(p=>project(...p)),
        fill,
        stroke
    );
}

function disc(x,y,rx,ry,fill){

    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    ctx.fillStyle=fill;
    ctx.fill();
}

function line(a,b,col,width=1){

    ctx.beginPath();
    ctx.moveTo(...a);
    ctx.lineTo(...b);
    ctx.lineWidth=width;
    ctx.strokeStyle=col;
    ctx.stroke();
}

function flat(x0,y0,x1,y1,col,z=0){
    face([
        [x0,y0,z],
        [x1,y0,z],
        [x1,y1,z],
        [x0,y1,z]
    ],col);
}

function diamond(col,stroke){
    face([
        [-.5,-.5,0],
        [.5,-.5,0],
        [.5,.5,0],
        [-.5,.5,0]
    ],col,stroke);
}

// TREES

function tree(x,y,size=1){

    const p=project(x,y);

    ctx.save();
    ctx.translate(...p);
    ctx.scale(size,size);

    disc(7,2,13,5,'#284e353b');

    line([0,1],[0,-21],'#805335',4);

    disc(-7,-21,10,13,'#367a3f');
    disc(6,-23,11,14,'#448e47');
    disc(0,-33,12,15,'#519e50');
    disc(-4,-35,7,9,'#79b95c');

    ctx.restore();
}

// ARCHITECTURE

function roof(
    x0,y0,x1,y1,h,rise,
    col1,col2,gable
){

    let mid=(x0+x1)/2;

    face([
        [x0,y1,h],
        [x1,y1,h],
        [mid,y1,h+rise]
    ],gable);

    face([
        [x0,y0,h],
        [x0,y1,h],
        [mid,y1,h+rise],
        [mid,y0,h+rise]
    ],col1,'#693c3444');

    face([
        [mid,y0,h+rise],
        [mid,y1,h+rise],
        [x1,y1,h],
        [x1,y0,h]
    ],col2,'#693c3444');

    line(
        project(mid,y0,h+rise),
        project(mid,y1,h+rise),
        '#f6dbbd88',
        1.5
    );
}

function walls(x0,y0,x1,y1,h,light,dark){

    face([
        [x0,y1,0],
        [x1,y1,0],
        [x1,y1,h],
        [x0,y1,h]
    ],light);

    face([
        [x1,y0,0],
        [x1,y1,0],
        [x1,y1,h],
        [x1,y0,h]
    ],dark);
}

function windowFront(x,y,z,w,h){

    face([
        [x,y,z],
        [x+w,y,z],
        [x+w,y,z+h],
        [x,y,z+h]
    ],'#faf0cc');

    face([
        [x+.025,y,z+1],
        [x+w-.025,y,z+1],
        [x+w-.025,y,z+h-1],
        [x+.025,y,z+h-1]
    ],'#508fae');

    line(
        project(x+w/2,y,z+1),
        project(x+w/2,y,z+h-1),
        '#fff8d9'
    );
}

function windowSide(x,y,z,w,h){

    face([
        [x,y,z],
        [x,y+w,z],
        [x,y+w,z+h],
        [x,y,z+h]
    ],'#f8e8c8');

    face([
        [x,y+.025,z+1],
        [x,y+w-.025,z+1],
        [x,y+w-.025,z+h-1],
        [x,y+.025,z+h-1]
    ],'#397e9d');
}

// COTTAGES AND VILLAS

function house(villa){

    const h=villa?33:22;
    const x0=-.34,x1=.31;
    const y0=-.35,y1=.24;

    disc(7,6,28,11,'#254e352f');

    flat(-.43,-.43,.43,.43,'#a3cc75');
    flat(-.07,.24,.08,.5,'#d9c9a1');

    walls(
        x0,y0,x1,y1,h,
        villa?'#fff0cd':'#f9d8a1',
        villa?'#c7b492':'#cfa26d'
    );

    face([
        [-.07,y1,0],
        [.06,y1,0],
        [.06,y1,13],
        [-.07,y1,13]
    ],'#835339');

    windowFront(-.29,y1,8,.14,10);
    windowFront(.13,y1,8,.13,10);
    windowSide(x1,-.24,8,.17,10);

    if(villa){
        windowFront(-.27,y1,23,.15,7);
        windowFront(.12,y1,23,.15,7);
        windowSide(x1,-.23,23,.16,7);
    }

    roof(
        x0-.04,y0-.04,
        x1+.04,y1+.04,
        h,
        villa?14:17,
        villa?'#537f91':'#ce7955',
        villa?'#365b71':'#a74c36',
        villa?'#e2cca3':'#e7bd87'
    );

    tree(-.36,.34,.42);
    tree(.36,-.33,.4);
}

// SHOPS

function shop(){

    disc(6,5,31,12,'#254e352f');

    flat(-.46,-.43,.46,.43,'#d9cbb1');

    walls(
        -.37,-.33,.36,.25,26,
        '#f9e1b5','#c8ac87'
    );

    flat(-.4,-.36,.39,.28,'#537e85',27);
    flat(-.32,-.28,.31,.21,'#91b2af',28);

    windowFront(-.31,.25,3,.23,15);
    windowFront(.07,.25,3,.22,15);
    windowSide(.36,-.23,5,.26,13);

    for(let i=0;i<6;i++){

        let x=-.36+i*.12;

        face([
            [x,.25,19],
            [x+.12,.25,19],
            [x+.12,.46,13],
            [x,.46,13]
        ],i%2?'#fff2d2':'#d65b50');
    }

    ctx.fillStyle='#e3d1a7';
    ctx.fillRect(-5,-31,16,4);
}

// PARKS

function park(){

    flat(-.43,-.43,.43,.43,'#8cc96b');

    flat(-.065,-.44,.065,.44,'#e4d5ae');
    flat(-.44,-.065,.44,.065,'#e4d5ae');

    disc(0,0,11,6,'#c3b8a1');
    disc(0,-1,8,4,'#79cddc');

    tree(-.25,-.25,.68);
    tree(.28,.27,.72);
    tree(.28,-.28,.5);
}

// FARMS

function farm(){

    flat(-.43,-.43,.43,.43,'#986a43');

    for(let i=0;i<5;i++){

        let x=-.36+i*.16;

        flat(x,-.4,x+.075,.4,'#704a34');

        for(let j=0;j<5;j++){

            let p=project(x+.04,-.34+j*.16);

            line(
                [p[0],p[1]],
                [p[0],p[1]-7],
                '#58913c',
                2
            );

            disc(
                p[0]-2,p[1]-5,
                3,2,'#e1bf57'
            );
        }
    }
}

// AUTOMATIC ROAD CONNECTIONS

function road(x,y){

    diamond('#c5bb9e');

    flat(-.28,-.28,.28,.28,'#666c72');

    const near=(a,b)=>
        town.buildings[key(x+a,y+b)]?.type==='road';

    const directions=[
        [1,0,.28,-.28,.5,.28],
        [-1,0,-.5,-.28,-.28,.28],
        [0,1,-.28,.28,.28,.5],
        [0,-1,-.28,-.5,.28,-.28]
    ];

    let connected=0;

    for(const [a,b,x0,y0,x1,y1] of directions){

        if(near(a,b)){

            flat(x0,y0,x1,y1,'#666c72');

            line(
                project(a*.32,b*.32),
                project(a*.48,b*.48),
                '#f0d9a0',
                1.6
            );

            connected++;
        }
    }

    if(!connected){
        flat(-.5,-.28,.5,.28,'#666c72');
    }
}

// TERRAIN RENDERING

function drawTile(t){

    const p=project(t.x,t.y);

    ctx.save();
    ctx.translate(...p);

    if(t.type==='water'){

        diamond(
            t.variant>.5?'#55b5cc':'#50afc7'
        );

        if(t.variant>.84){
            line([-9,2],[5,2],'#b3e6e655',1);
        }

    }else if(t.type==='sand'){

        diamond(
            t.variant>.5?'#eed6a0':'#e8cc91'
        );

    }else{

        const greens=[
            '#89bf61',
            '#8dc367',
            '#91c66a',
            '#85bc60'
        ];

        diamond(
            greens[Math.floor(t.variant*4)]
        );

        if(t.variant>.5){

            const p=project(-.24,.1);

            line(
                [p[0],p[1]],
                [p[0]-2,p[1]-4],
                '#69a74b77'
            );

            line(
                [p[0],p[1]],
                [p[0]+3,p[1]-3],
                '#69a74b77'
            );
        }
    }

    if(
        town.buildings[key(t.x,t.y)]?.type==='road'
    ){
        road(t.x,t.y);
    }

    ctx.restore();
}

function drawObject(t){

    const b=town.buildings[key(t.x,t.y)];
    const p=project(t.x,t.y);

    ctx.save();
    ctx.translate(...p);

    if(b){

        if(moving===key(t.x,t.y)){
            ctx.globalAlpha=.45;
        }

        switch(b.type){

            case 'cottage':
                house(false);
                break;

            case 'villa':
                house(true);
                break;

            case 'shop':
                shop();
                break;

            case 'park':
                park();
                break;

            case 'farm':
                farm();
                break;
        }

    }else if(t.tree){

        tree(0,0,.68+t.variant*.28);
    }

    ctx.restore();
}

// PERFORMANCE OPTIMISATION

function visible(t){

    const p=project(t.x,t.y);

    const x=p[0]*zoom+camX;
    const y=p[1]*zoom+camY;

    return (
        x>-110*zoom &&
        x<W+110*zoom &&
        y>-40*zoom &&
        y<H+110*zoom
    );
}

function render(){

    ctx.setTransform(DPR,0,0,DPR,0,0);

    ctx.fillStyle='#459fb9';
    ctx.fillRect(0,0,W,H);

    ctx.translate(camX,camY);
    ctx.scale(zoom,zoom);

    const view=tiles.filter(visible);

    for(const t of view){
        drawTile(t);
    }

    if(
        hover &&
        inside(hover.x,hover.y) &&
        mode!=='pan'
    ){

        const k=key(hover.x,hover.y);

        const ok=mode==='build'
            ?canBuild(hover.x,hover.y)
            :mode==='move'&&moving
            ?canBuild(hover.x,hover.y)
            :!!town.buildings[k];

        ctx.save();

        ctx.translate(
            ...project(hover.x,hover.y)
        );

        diamond(
            ok?'#fff7b066':'#e95f5966',
            ok?'#fff6b0':'#a32e30'
        );

        ctx.restore();
    }

    for(const t of view){
        drawObject(t);
    }
}

function frame(){

    if(dirty){
        render();
        dirty=false;
    }

    requestAnimationFrame(frame);
}

// ========================================
// 05 — CONSTRUCTION AND MANAGEMENT
// ========================================

function selectMode(m){

    mode=m;
    moving=null;

    document.querySelectorAll(
        '[data-mode]'
    ).forEach(b=>
        b.classList.toggle(
            'active',
            b.dataset.mode===m
        )
    );

    document.querySelectorAll(
        '.item'
    ).forEach(b=>
        b.classList.toggle(
            'active',
            m==='build'&&b.dataset.type===selected
        )
    );

    message(
        m==='build'
        ?'Tap grass to build '+TYPES[selected].name+' • Drag to explore'
        :m==='move'
        ?'Tap a building to move it for free'
        :m==='sell'
        ?'Tap a building to sell for 50% of its price'
        :'Drag to explore • Scroll or pinch to zoom'
    );

    dirty=true;
}

function act(x,y){

    const k=key(x,y);
    const b=town.buildings[k];

    if(!inside(x,y)||mode==='pan')return;

    if(mode==='build'){

        const t=TYPES[selected];

        if(!canBuild(x,y)){
            message('Choose an empty grass tile.');
            return;
        }

        if(town.cash<t.cost){
            message('Not enough cash for this building.');
            return;
        }

        town.cash-=t.cost;

        town.buildings[k]={
            type:selected
        };

        message(
            t.name+' built!'+achievements()
        );

    }else if(mode==='sell'){

        if(!b){
            message('Choose a building to sell.');
            return;
        }

        const refund=Math.floor(
            TYPES[b.type].cost/2
        );

        delete town.buildings[k];

        town.cash+=refund;

        message(
            'Sold '+TYPES[b.type].name+
            ' for '+money(refund)
        );

    }else if(mode==='move'){

        if(!moving){

            if(!b){
                message('Choose an existing building.');
                return;
            }

            moving=k;

            message('Now tap an empty grass tile.');

            dirty=true;
            return;
        }

        if(k===moving){

            moving=null;
            message('Move cancelled.');

            dirty=true;
            return;
        }

        if(!canBuild(x,y)){
            message('Choose an empty grass tile.');
            return;
        }

        town.buildings[k]=town.buildings[moving];

        delete town.buildings[moving];

        moving=null;

        message('Building moved for free.');
    }

    hud();
    save();

    dirty=true;
}

// CONSTRUCTION CATALOGUE

for(const [type,t] of Object.entries(TYPES)){

    const b=document.createElement('button');

    b.className='item';
    b.dataset.type=type;

    b.innerHTML=`
        <i>${t.icon}</i>
        <span>${t.name}</span>
        <small>${money(t.cost)}</small>
    `;

    b.onclick=()=>{
        selected=type;
        selectMode('build');
    };

    $('catalogue').append(b);
}

document.querySelectorAll(
    '[data-mode]'
).forEach(
    b=>b.onclick=()=>selectMode(b.dataset.mode)
);

// ========================================
// 06 — MOUSE AND TOUCHSCREEN CONTROLS
// ========================================

const pointers=new Map();

let gesture=false;

function point(e){

    const r=canvas.getBoundingClientRect();

    return {
        x:e.clientX-r.left,
        y:e.clientY-r.top
    };
}

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function midpoint(a,b){
    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };
}

canvas.addEventListener('pointerdown',e=>{

    const p=point(e);

    if(!pointers.size)gesture=false;

    pointers.set(
        e.pointerId,
        {...p,sx:p.x,sy:p.y}
    );

    if(pointers.size>1||e.button!==0){
        gesture=true;
    }

    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{

    const p=point(e);
    const old=pointers.get(e.pointerId);

    hover=tileAt(p.x,p.y);
    dirty=true;

    if(!old)return;

    if(pointers.size>=2){

        const other=[
            ...pointers.entries()
        ].find(
            ([id])=>id!==e.pointerId
        )[1];

        const a=midpoint(old,other);
        const b=midpoint(p,other);

        const prev=distance(old,other);

        if(prev>2){
            zoomAt(
                distance(p,other)/prev,
                a.x,a.y
            );
        }

        camX+=b.x-a.x;
        camY+=b.y-a.y;

        gesture=true;

    }else{

        if(
            Math.hypot(
                p.x-old.sx,
                p.y-old.sy
            )>7
        ){
            gesture=true;
        }

        if(gesture){
            camX+=p.x-old.x;
            camY+=p.y-old.y;
        }
    }

    pointers.set(
        e.pointerId,
        {...p,sx:old.sx,sy:old.sy}
    );
});

canvas.addEventListener('pointerup',e=>{

    const p=point(e);

    if(
        pointers.size===1 &&
        !gesture &&
        e.button===0
    ){

        const t=tileAt(p.x,p.y);

        act(t.x,t.y);
    }

    pointers.delete(e.pointerId);

    if(!pointers.size)gesture=false;

    dirty=true;
});

canvas.addEventListener('pointercancel',e=>{

    pointers.delete(e.pointerId);
    gesture=true;
});

canvas.addEventListener('pointerleave',()=>{

    if(!pointers.size){
        hover=null;
        dirty=true;
    }
});

canvas.addEventListener('wheel',e=>{

    e.preventDefault();

    const p=point(e);

    zoomAt(
        Math.exp(-e.deltaY*.0015),
        p.x,p.y
    );

},{passive:false});

canvas.addEventListener(
    'contextmenu',
    e=>e.preventDefault()
);

window.addEventListener('keydown',e=>{

    if(e.key==='Escape'){
        selectMode('pan');
    }
});

// ========================================
// START GAME
// ========================================

resize();
hud();
save();
frame();

</script>
